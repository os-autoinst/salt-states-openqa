{%- set numofworkers = pillar['workerconf'].get(grains['host'], {}).get('numofworkers', 0) %}
{%- set additional_worker_classes = [grains['host']] %}
{%- if 'cpu_worker_classes.compute' in salt -%}
{%- do additional_worker_classes.extend(salt['cpu_worker_classes.compute'](grains['cpuarch'], grains['cpu_flags'])) -%}
{%- endif -%}
# This file is generated by salt - don't touch
# Hosted on https://gitlab.suse.de/openqa/salt-pillars-openqa
# numofworkers: {{ numofworkers }}

[global]
HOST={%- for webui in webuis %}{{ webui }} {% endfor %}
CACHEDIRECTORY=/var/lib/openqa/cache
LOG_LEVEL=debug
NICOFFSET={{ pillar['workerconf'].get(grains['host'], {}).get('nic_offset', 64) }}
{% if global.get('WORKER_CLASS', '') is match('.*qemu.*') -%}
{%- do global.setdefault('LOCK_NAME', 'local-job') -%}
{%- do global.setdefault('LOCK_EXPIRATION', '30') -%}
{%- do global.setdefault('LOCK_LIMIT', '10') -%}
{% endif -%}
{% for key, value in global.items() -%}

{%- if key == 'WORKER_CLASS' -%}
{{ key }}={{ value }},{{ additional_worker_classes | join(",") }}
{% else -%}
{{ key }}={{ value }}
{% endif -%}

{% endfor -%}

{%- set concrete_worker_classes = {} -%}
{%- for sec_id in workers.keys() -%}
  {%- if (sec_id|string).isdigit() -%}
    {%- do concrete_worker_classes.update({sec_id|int: global.get('WORKER_CLASS', '')}) -%}
  {%- endif -%}
{%- endfor -%}
{%- for sec_id, details in workers.items() -%}
  {%- set new_class = details.get('WORKER_CLASS') -%}
  {%- set append_class = details.get('WORKER_CLASS+') -%}
  {%- if new_class is not none or append_class is not none -%}
    {%- for part in (sec_id|string).split(',') -%}
      {%- set part = part.strip() -%}
      {%- if '-' in part -%}
        {%- set range_bounds = part.split('-') -%}
        {%- set start_slot = range_bounds[0]|int -%}
        {%- set end_slot = range_bounds[1]|int -%}
      {%- elif part.isdigit() -%}
        {%- set start_slot = part|int -%}
        {%- set end_slot = part|int -%}
      {%- else -%}
        {%- set start_slot = 0 -%}
        {%- set end_slot = -1 -%}
      {%- endif -%}
      {%- for slot in concrete_worker_classes.keys() -%}
        {%- if slot >= start_slot and slot <= end_slot -%}
          {%- if new_class is not none -%}
            {%- do concrete_worker_classes.update({slot: new_class}) -%}
          {%- endif -%}
          {%- if append_class is not none -%}
            {%- set current = concrete_worker_classes[slot] -%}
            {%- do concrete_worker_classes.update({slot: (current ~ ',' ~ append_class) if current else append_class}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endfor -%}
  {%- endif -%}
{%- endfor -%}

{% for workerid, details in workers.items() %}
[{{ workerid }}]
{% if (workerid|string).isdigit() -%}
{% if concrete_worker_classes.get(workerid|int, '') is match('.*qemu.*') -%}
{% if not global.get('LOCK_NAME', '') is equalto('local-job') -%}
{%- do details.setdefault('LOCK_NAME', 'local-job') -%}
{%- do details.setdefault('LOCK_EXPIRATION', '30') -%}
{%- do details.setdefault('LOCK_LIMIT', '10') -%}
{% endif -%}
{% else -%}
{% if not global.get('LOCK_NAME', '') is equalto('') -%}
{%- do details.setdefault('LOCK_NAME', '') -%}
{% endif -%}
{% endif -%}
{% endif -%}
{% for key, value in details.items() -%}

{%- if key == 'WORKER_CLASS' -%}
{{ key }}={{ value }},{{ additional_worker_classes | join(",") }}
{% else -%}
{{ key }}={{ value }}
{% endif -%}

{%- endfor -%}
{% endfor %}

{%- for webui in webuis %}
{%- set webui_config = pillar.get('workerconf', {})['available_webuis'][webui] %}
[{{ webui }}]
TESTPOOLSERVER = {{ webui_config['testpoolurl'] }}
{% endfor %}
