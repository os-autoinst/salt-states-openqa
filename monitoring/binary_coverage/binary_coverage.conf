[[inputs.exec]]
  # The fleet still has telegraf 1.28 (Leap 15.6); its array command form
  # needs 1.39, so keep the single string like the other inputs. The script
  # reads /etc/binary_coverage/collector.json by default.
  commands = [ '/etc/telegraf/scripts/binary_coverage_monitor.py' ]
  interval = "1h"
  timeout = "10m"
  data_format = "influx"
