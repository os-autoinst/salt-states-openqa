[global_tags]
[agent]
  interval = "1m"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1m"
  flush_jitter = "10s"
  precision = ""
  debug = false
  quiet = false
  logfile = ""
  hostname = ""
  omit_hostname = false

# use multiple [[inputs.ping]] sections so one unresolvable hostname does not prevent
# all other ping data to be gathered
[[inputs.ping]]
  urls = [ "openqa.suse.de" ]
  count = 1
  ping_interval = 1.0
  timeout = 1.0
  deadline = 10

# explicitly ping OSD via IPv4 and IPv6 to catch protocol errors
# The ipv4/ipv6 options need telegraf >= 1.30.1, but the fleet still contains
# telegraf 1.28.1 (e.g. openSUSE Leap 15.6 on ppc64le), so resolve both
# addresses in Jinja and ping the literals instead of using those options.
# Can be simplified with "ipv4"/"ipv6" once all hosts run telegraf >= 1.30.1
# (see https://github.com/influxdata/telegraf/pull/15011)
{%- set test_domain = "openqa.suse.de" %}
{%- set test_ipv4 = salt["dnsutil.A"](test_domain)[0] %}
{%- set test_ipv6 = salt["dnsutil.AAAA"](test_domain)[0] %}
[[inputs.ping]]
  urls = [ "{{ test_ipv4 }}" ]
  tags = { "protocol_version" = "4" }
  count = 1
  ping_interval = 1.0
  timeout = 1.0
  deadline = 10

[[inputs.ping]]
  urls = [ "{{ test_ipv6 }}" ]
  tags = { "protocol_version" = "6" }
  count = 1
  ping_interval = 1.0
  timeout = 1.0
  deadline = 10

# map the bare ip in the url tag back to the human readable name so existing
# dashboard queries keep working.
# processors.enum cannot be used for this: its "tag" option was removed in
# telegraf 1.40 and its replacement "tags" does not exist in 1.28.1. The
# "tags" table of processors.override is supported by both versions.
[[processors.override]]
  namepass = [ "ping" ]
  [processors.override.tagpass]
    protocol_version = [ "4", "6" ]
  [processors.override.tags]
    url = "{{ test_domain }}"

{%- set fqdn = grains['fqdn'] -%}
{% for required_network in pillar['workerconf']['required_external_networks'] | default([]) %}
{%- if  (('exclude_on_regex' not in required_network) or not (fqdn is match(required_network['exclude_on_regex'])))
    and (('include_on_regex' not in required_network) or     (fqdn is match(required_network['include_on_regex']))) -%}
{% if "check_url" in required_network %}
[[inputs.http_response]]
  urls = [ '{{ required_network["check_url"] }}' ]
  response_timeout = "20s"
  interval = "1m"
{% else %}
[[inputs.ping]]
  urls = ['{{ required_network['host'] }}']
  count = 1
  ping_interval = 10.0
  timeout = 1.0
  deadline = 10
  [inputs.ping.tags]
    network="external"
{% endif %}
{%- endif -%}
{% endfor %}

[[inputs.http_response]]
  urls = [ "https://openqa.suse.de/health" ]
  response_timeout = "20s"
  interval = "10m"

[[inputs.http]]
  urls = [ "http://localhost:9530/influxdb/minion" ]
  data_format = "influx"
  timeout = "40s"
  interval = "1m"

{% for service in ['sshd','telegraf','salt-minion','openqa-worker-cacheservice-minion','openqa-worker-cacheservice'] %}
[[inputs.procstat]]
  cgroup = "systemd/system.slice/{{ service }}.service"
{% endfor %}

{% for i in range(pillar['workerconf'].get(grains['host'], {}).get('numofworkers', 0)) %}
[[inputs.procstat]]
  cgroup = "systemd/openqa.slice/openqa-worker.slice/openqa-worker-auto-restart@{{ i+1 }}.service"
{% endfor %}
